name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: trabajo-despliegue-on-premise
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to remote host
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude '.git' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:~/$DEPLOY_PATH/"

      - name: Deploy on remote host
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/$DEPLOY_PATH && chmod +x scripts/deploy.sh && ./scripts/deploy.sh"

      - name: Verificar estado de los contenedores (remoto)
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/$DEPLOY_PATH && docker compose ps"

      - name: DEBUG temporal - probar por IP real y puertos en uso
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo '--- quien escucha en 8080 ---' && \
             sudo ss -tlnp | grep ':8080' || ss -tln | grep ':8080' && \
             echo '--- docker port ---' && \
             docker port futbol-brutal-web && \
             echo '--- curl con Host=localhost pero IP real ---' && \
             curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://$DEPLOY_HOST:8080/iaslab/ingesoft5/despliegueprueba/ && \
             echo '--- curl a la raiz por IP real ---' && \
             curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://$DEPLOY_HOST:8080/ && \
             echo '--- headers completos ruta nueva por IP real ---' && \
             curl -sI http://$DEPLOY_HOST:8080/iaslab/ingesoft5/despliegueprueba/ && \
             echo '--- server header (nginx version) ---' && \
             curl -sI http://$DEPLOY_HOST:8080/ | grep -i server"

      - name: Limpiar llave temporal
        if: always()
        run: rm -f ~/.ssh/deploy_key
