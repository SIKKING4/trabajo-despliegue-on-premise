name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: trabajo-despliegue-on-premise
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync files to remote host
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude '.git' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:~/$DEPLOY_PATH/"

      - name: Deploy on remote host
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/$DEPLOY_PATH && chmod +x scripts/deploy.sh && ./scripts/deploy.sh"

      - name: Verificar estado de los contenedores (remoto)
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/$DEPLOY_PATH && docker compose ps"

      - name: DEBUG temporal - inspeccionar contenido y responder ruta
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo '--- contenido dentro del contenedor ---' && \
             docker exec futbol-brutal-web find /usr/share/nginx/html -maxdepth 6 && \
             echo '--- config activa de nginx ---' && \
             docker exec futbol-brutal-web cat /etc/nginx/conf.d/default.conf && \
             echo '--- curl a la ruta nueva ---' && \
             curl -sv http://localhost:8080/iaslab/ingesoft5/despliegueprueba/ 2>&1 | tail -30"

      - name: Limpiar llave temporal
        if: always()
        run: rm -f ~/.ssh/deploy_key
